name: Scrape EU Xbox server counts

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min (off the :00 rush, GitHub delays those)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape dunestatus.com and rebuild summary
        run: python scraper/scrape.py
      - name: Commit new data
        run: |
          git config user.name "dune-tracker-bot"
          git config user.email "dune-tracker-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No new snapshot"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
